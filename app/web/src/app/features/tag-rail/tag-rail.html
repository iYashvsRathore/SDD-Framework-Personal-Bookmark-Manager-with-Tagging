<!--
  F04-AC1, AC10, AC11. Ported from docs/mockup.html's renderTags(): the "All
  bookmarks" button first, then one button per live tag, alphabetical order
  (store.tagRail() is already alphabetical, per GET /api/tags, lld.md section 4).
-->
<nav id="tags" class="tags" aria-label="Filter by tag">
  <button
    type="button"
    class="tg"
    [attr.aria-pressed]="store.tagFilter() === null ? 'true' : 'false'"
    (click)="onTagClick(null)"
  >
    <span class="ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path [attr.d]="icons.tag" />
      </svg>
    </span>
    All bookmarks
    <span class="n">{{ store.allCount() }}</span>
  </button>

  @for (tag of store.tagRail(); track tag.id) {
    <button
      type="button"
      class="tg"
      [attr.aria-pressed]="store.tagFilter() === tag.name ? 'true' : 'false'"
      (click)="onTagClick(tag.name)"
    >
      <span class="dot" [style.--h]="tagHue(tag.name)"></span>
      {{ tag.name }}
      <span class="n">{{ tag.bookmark_count }}</span>
    </button>
  }
</nav>
